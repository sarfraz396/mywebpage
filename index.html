const textbox = document.getElementById("searchbox");
const textshow = document.getElementById("showproduct");
const selectitem = document.getElementById("menu");
const sortingproduct = document.getElementById("sortingitem")
const displaycart = document.getElementById("showcart");
const carttoggle = document.getElementById("carttoggle");
const cartcount = document.getElementById("cartcount");




let cart = [];





// load cart
 function loadcart(){
    const cartdate = localStorage.getItem("cart");
    if(cartdate){
        cart = JSON.parse(cartdate);
    }
 }


 // save cart
 function savecart() {
    const addcartforlocalstorage = JSON.stringify(cart);
    localStorage.setItem("cart", addcartforlocalstorage);
 }

function displayproducts(myproduct) {
    textshow.innerHTML = "";

    if (myproduct.length === 0) {
        textshow.innerText = "Product not found";
        return;
    }

    myproduct.forEach((product) => {
        const card = document.createElement("div");
        card.classList.add("product-card");
        const image = document.createElement("img");
        image.classList.add("product-image");
        image.src = product.image;
        image.alt = product.name;
        image.loading = "lazy";
        image.onerror = function() {
            image.src = "https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=900&q=85";
        };
        const name = document.createElement("h4");
        name.classList.add("product-name");
        name.innerText = product.name;
    

        const id = document.createElement("p");
        id.innerText = `ID: ${product.id}`;

        const price = document.createElement("p");
        price.classList.add("product-price");
        price.innerText = `Rs. ${product.price}`;
        

        const category = document.createElement("p");
        category.classList.add("product-category");
        category.innerText = `Category: ${product.category}`;

        const stock = document.createElement("p");
        stock.classList.add("product-stock");
        stock.innerText = product.stock === 0 ? "Out of stock" : `Stock: ${product.stock}`;

        const rating = document.createElement("p");
        rating.classList.add("product-rating");
        rating.innerText = `Rating: ${product.rating.average} (${product.rating.count} reviews)`;

        const cartbutton = document.createElement("button");
        cartbutton.classList.add("add-to-cart");
        cartbutton.innerText = "Add to cart";
        cartbutton.disabled = product.stock === 0;
        cartbutton.addEventListener("click", function() {
            addtocard(product.id);
        });

        card.append(image, category, name, rating, price, stock, cartbutton);
        textshow.append(card);
    });
}

function updateproducts() {
    const searchtext = textbox.value.toLowerCase().trim();
    const selectedcategory = selectitem.value;
    const sortoption = sortingproduct.value;

    let filteredproducts = products.filter((product) => {
        const matchesname = product.name.toLowerCase().includes(searchtext);
        const matchescategory = selectedcategory === "all" || product.category === selectedcategory;
        return matchesname && matchescategory;
    });

    if (sortoption === "low-to-high") {
        filteredproducts.sort((a, b) => a.price - b.price);
    } else if (sortoption === "high-to-low") {
        filteredproducts.sort((a, b) => b.price - a.price);
    } else if (sortoption === "high-rating") {
        filteredproducts.sort((a, b) => b.rating.average - a.rating.average);
    }

    displayproducts(filteredproducts);
}

textbox.addEventListener("input", updateproducts);
selectitem.addEventListener("change", updateproducts);
sortingproduct.addEventListener("change", updateproducts);

carttoggle.addEventListener("click", function() {
    displaycart.hidden = !displaycart.hidden;
    const isexpanded = !displaycart.hidden;
    carttoggle.setAttribute("aria-expanded", String(isexpanded));
    carttoggle.setAttribute("aria-label", `${isexpanded ? "Hide" : "View"} basket, ${cartcount.innerText} items`);

    if (isexpanded) {
        displaycart.scrollIntoView({ block: "nearest" });
    }
});

document.addEventListener("click", function(event) {
    const clickpath = event.composedPath();
    if (
        displaycart.hidden ||
        clickpath.includes(displaycart) ||
        clickpath.includes(carttoggle)
    ) {
        return;
    }

    displaycart.hidden = true;
    carttoggle.setAttribute("aria-expanded", "false");
    carttoggle.setAttribute("aria-label", `View basket, ${cartcount.innerText} items`);
});

function addtocard(productid) {
    const productfind = products.find((item) => item.id === productid);
    if (!productfind) {
        console.log("Product not found");
        return;
    }

    const existingcart = cart.find((item) => item.id === productid);
    if (productfind.stock === 0) {
        console.log("Product is out of stock");
        return;
    }

    if (existingcart) {
        if (existingcart.quantity < productfind.stock) {
            existingcart.quantity++;
            savecart();
        } else {
            console.log("Cart maximum quantity reached");
            return;
        }
    } else {
        cart.push({
            id: productfind.id,
            name: productfind.name,
            price: productfind.price,
            quantity: 1
        });
         savecart();
    }


    console.log(cart);
   
    cartdispl();
}

function cartdispl() {
    const itemcount = cart.reduce((sum, item) => sum + item.quantity, 0);
    cartcount.innerText = itemcount;
    carttoggle.setAttribute("aria-label", `${displaycart.hidden ? "View" : "Hide"} basket, ${itemcount} items`);
    displaycart.innerHTML = "";
    if (cart.length === 0) {
        displaycart.innerText = "Cart is empty";
        return;
    }

    cart.forEach((item) => {
        const cartitem = document.createElement("div");
        cartitem.classList.add("cart-item");
        const product = products.find((currentproduct) => currentproduct.id === item.id);
        const image = document.createElement("img");
        image.src = product.image;
        image.alt = item.name;
        const details = document.createElement("div");
        details.classList.add("cart-item-details");
        const name = document.createElement("h4");
        name.innerText = item.name;
        name.classList.add("cart-name");
        const price = document.createElement("p");
        price.innerText = `Rs. ${item.price}`;
        price.classList.add("cart-price");
        const quantity = document.createElement("p");
        quantity.innerText = `Quantity: ${item.quantity}`;
        quantity.classList.add("cart-quantity");

        details.append(name, price, quantity);
        cartitem.append(image, details);
        // plus button
       const plusbutton = document.createElement("button");
plusbutton.innerText = "+";

plusbutton.addEventListener("click", function () {

    const originalProduct = products.find((product) => {
        return product.id === item.id;
    });

    if (item.quantity < originalProduct.stock) {

        item.quantity++;

        savecart();

        cartdispl();

    } else {

        console.log("Cart maximum quantity reached");

    }

});

// minus button

     const minbtn = document.createElement("button");
     minbtn.innerText = "-";
     minbtn.addEventListener("click",function(){
  
        if(item.quantity>1){
            item.quantity--;
            savecart();

            cartdispl();
        }

        else{
            cart = cart.filter((currentitem)=>{
             return     currentitem.id !== item.id;
            });
            savecart();
            cartdispl();
        }
     });

     // remove button
     const removebtn = document.createElement("button");
      removebtn.innerText = "Remove";
      
     removebtn.addEventListener("click",function(){

        cart = cart.filter((currentitem)=>{

            return currentitem.id !== item.id;

        });

        savecart();
        cartdispl();




     })
        plusbutton.setAttribute("aria-label", `Increase ${item.name} quantity`);
        minbtn.setAttribute("aria-label", `Decrease ${item.name} quantity`);
        removebtn.classList.add("remove-item");
        cartitem.append(plusbutton, minbtn, removebtn);
        displaycart.append(cartitem);
    });


    // discount function
function discountcal(total) {
    if (total >= 5000) {
        return (total * 10) / 100;
    } else {
        return 0;
    }
}

const subtotal = cart.reduce((sum, item) => {
    return sum + item.price * item.quantity;
}, 0);



// shiping charges 
function shippingcharges(total) {
    if (total >= 1000) {
        return 0;
    } else {
        return 100;
    }
}


 
const shipping  =  shippingcharges(subtotal);

const discount = discountcal(subtotal);
const finaltotal = subtotal - discount;
const finalamount = finaltotal + shipping;


const totaldisplay = document.createElement("div");
totaldisplay.classList.add("cart-summary");

[
    ["Subtotal", subtotal, ""],
    ["Discount", discount, "summary-discount"],
    ["Shipping", shipping, ""],
    ["Total", finalamount, "summary-total"]
].forEach(([label, amount, className]) => {
    const row = document.createElement("p");
    row.classList.add("summary-row");
    if (className) row.classList.add(className);

    const rowLabel = document.createElement("span");
    rowLabel.innerText = label;
    const rowAmount = document.createElement("strong");
    rowAmount.innerText = `Rs. ${amount}`;

    row.append(rowLabel, rowAmount);
    totaldisplay.append(row);
});

displaycart.append(totaldisplay);
}

loadcart();
updateproducts();


cartdispl();
